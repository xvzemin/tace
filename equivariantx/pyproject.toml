[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equivariantx"
version = "0.1.0"
description = "Spherical and Cartesian O(3)/O(2) operators, frame conversions, and fused CUDA convolutions."
readme = "README.md"
authors = [{ name = "Zemin Xu", email = "xv_chana@163.com" }]
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "e3nn>=0.4.4",
    "scipy>=1.15",
]

[project.optional-dependencies]
dev = ["pytest"]
cuda = ["ninja", "filelock"]
mace = ["mace-torch>=0.3.17"]
nequip = ["nequip>=0.19.1"]
sevennet = ["sevenn>=0.13.0"]

[project.urls]
Homepage = "https://github.com/xvzemin/tace"
Documentation = "https://tace.readthedocs.io/en/latest/equivariantx/api.html"

[tool.setuptools]
packages = [
    "equivariantx",
    "equivariantx.co2",
    "equivariantx.co3",
    "equivariantx.co3.ictd",
    "equivariantx.co3.ictp",
    "equivariantx.conv",
    "equivariantx.conv.co3",
    "equivariantx.conv.o2_o3",
    "equivariantx.conv.uu_o2",
    "equivariantx.conv.uv_o2",
    "equivariantx.mbe",
    "equivariantx.mbe.ace",
    "equivariantx.mbe.bce",
    "equivariantx.mbe.ece",
    "equivariantx.models",
    "equivariantx.models.equflash",
    "equivariantx.models.mace",
    "equivariantx.models.nequip",
    "equivariantx.models.prophet",
    "equivariantx.models.sevennet",
    "equivariantx.models.tace",
    "equivariantx.models.tace.tace_oam_xl_v2",
    "equivariantx.models.tace.tece_oam_rra",
    "equivariantx.nn",
    "equivariantx.o2",
    "equivariantx.o3",
    "equivariantx.o3.cgtp",
    "equivariantx.o3.gtp",
    "equivariantx.o3.mtp",
    "equivariantx.o3.wigner6j",
    "equivariantx.ops",
    "equivariantx.ops.common",
    "equivariantx.ops.common.cuda",
    "equivariantx.ops.common.cuda.models",
    "equivariantx.ops.common.cuda.models.tace",
    "equivariantx.ops.common.cuda.o2_o3",
    "equivariantx.ops.common.cuda.o3",
    "equivariantx.ops.common.torch",
    "equivariantx.ops.cuda",
    "equivariantx.ops.cuda.co2",
    "equivariantx.ops.cuda.co3",
    "equivariantx.ops.cuda.co3.ictd",
    "equivariantx.ops.cuda.co3.ictp",
    "equivariantx.ops.cuda.conv",
    "equivariantx.ops.cuda.conv.co3",
    "equivariantx.ops.cuda.conv.o2_o3",
    "equivariantx.ops.cuda.conv.uu_o2",
    "equivariantx.ops.cuda.conv.uv_o2",
    "equivariantx.ops.cuda.mbe",
    "equivariantx.ops.cuda.mbe.ace",
    "equivariantx.ops.cuda.nn",
    "equivariantx.ops.cuda.o2",
    "equivariantx.ops.cuda.o3",
    "equivariantx.ops.cuda.o3.cgtp",
    "equivariantx.ops.cuda.o3.wigner6j",
    "equivariantx.ops.kernels",
    "equivariantx.ops.torch",
    "equivariantx.ops.torch.co2",
    "equivariantx.ops.torch.co3",
    "equivariantx.ops.torch.co3.ictd",
    "equivariantx.ops.torch.co3.ictp",
    "equivariantx.ops.torch.conv",
    "equivariantx.ops.torch.conv.co3",
    "equivariantx.ops.torch.conv.o2_o3",
    "equivariantx.ops.torch.conv.uu_o2",
    "equivariantx.ops.torch.conv.uv_o2",
    "equivariantx.ops.torch.mbe",
    "equivariantx.ops.torch.mbe.ace",
    "equivariantx.ops.torch.nn",
    "equivariantx.ops.torch.o2",
    "equivariantx.ops.torch.o3",
    "equivariantx.ops.torch.o3.cgtp",
    "equivariantx.ops.torch.o3.gtp",
    "equivariantx.ops.torch.o3.mtp",
    "equivariantx.ops.torch.o3.wigner6j",
    "equivariantx.utils",
]
package-dir = { equivariantx = "." }

[tool.setuptools.package-data]
equivariantx = ["README.md", "ops/common/cuda/csrc/*.cpp", "models/tace/tace_oam_xl_v2/README.rst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
