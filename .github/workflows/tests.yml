name: Tests

on: [push, pull_request]

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up MSVC for TorchSim CPU kernels
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: python -m pip install ".[dev]" "torch-sim-atomistic==0.6.2"
      - name: Test TACE CPU operations and interfaces
        run: python -m pytest tests -q
      - name: Test EQX portable operations
        run: python -m pytest eqx/tests -q
