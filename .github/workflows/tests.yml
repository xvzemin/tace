name: Tests

on: [push, pull_request]

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up MSVC for TorchSim CPU kernels
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build TACE with bundled EquivariantX and Foundation
        run: python -m pip wheel --no-deps --wheel-dir "${{ runner.temp }}/wheels" .
      - name: Install the wheel and test dependencies
        id: install
        shell: bash
        working-directory: ${{ runner.temp }}/wheels
        run: |
          wheels=(tace-*.whl)
          python -m pip install "./${wheels[0]}[dev,spb]" "torch-sim-atomistic==0.6.2"
      - name: Verify the installed distribution and CPU execution
        run: python -I .github/check_wheel.py
      - name: Test TACE CPU operations and interfaces
        run: python -m pytest tests -q
      - name: Test EQX portable operations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest equivariantx/tests -q
      - name: Test Foundation adapters
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest equivariantx_foundation/tests -q
