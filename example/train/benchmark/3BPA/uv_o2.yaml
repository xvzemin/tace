# Use the 3BPA CGTP training setup with a local O(2) interaction.
# Select model.config.atomic_basis.type=uv_rra_o2 for radial rotary attention.
defaults:
  - o3@_global_
  - _self_

model:
  config:
    mmax: 3
    atomic_basis:
      type: uv_o2
      edge_nonlinear: gate
      scalar_act: [silu, tanh]
