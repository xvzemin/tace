# Magnetic TACE inherits TACE and only overrides its magnetic architecture,
# dataset keys, loss, and validation metric.
defaults:
  - tace
  - _self_

dataset:
  train_file: ${oc.env:HOME}/dataset/FeAl/collinear_FeAl.xyz
  valid_file: null
  valid_ratio: 0.1
  keys:
    energy_key: energy
    forces_key: forces
    stress_key: stress
    virials_key: virials
    initial_noncollinear_magmoms_key: initial_noncollinear_magmoms
    noncollinear_magnetic_forces_key: noncollinear_magnetic_forces

  train_dataloader:
    batch_size: 16

  valid_dataloader:
    batch_size: 8
    
  storage_mode: lmdb
  shard_dirs: 
    - ${oc.env:HOME}/dataset/FeAl/graphCache

loss:
  loss_property: [energy, forces, stress, noncollinear_magnetic_forces]
  loss_function_name:
    - mse_energy_per_atom
    - mse_forces
    - mse_stress
    - mse_noncollinear_magnetic_forces
  loss_property_weights: [1.0, 1.0, 1.0, 10.0]
  loss_function_kwargs:
    - {}
    - {}
    - {}
    - {}

synth_metric:
  val/noncollinear_magnetic_forces_mae: 5.0
  val/noncollinear_magnetic_forces_rmse: 1.0

model:
  config:
    parity: true

    magnetic_edge_update:
      type: element # [identity, element, element2], when num_elements > 1, use element or element2

    angular_basis:
      magnetic_Lmax: 2
      magnetic_normalization: element
      magnetic_use_soc: true

    radial_basis:
      magnetic_normalization: rational

    scale_shift:
      magmoms_scale_type: rms_noncollinear_magmoms_norm_by_element

    atomic_basis:
      type: o2_mag
      use_radial_rotary_attention: true

    readout_emlp:
      use_one_body_magmoms: true
