# TECE shares the complete training workflow with TACE and only overrides
# architecture parameters that differ from example/train/tace.yaml.
defaults:
  - tace
  - _self_

model:
  config:
    mmax: 2
    Lmax: 3
    num_channel: 64

    resnet:
      linear_type: identity

    atomic_basis:
      type: [cgtp, uv_so2, uv_so2]
      edge_ace_hidden: 32
      num_head: 4

    product_basis:
      nonlinear: bilinear_gate
      scalar_act: scaled_silu
      agnostic: true
