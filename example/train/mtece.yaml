# Magnetic TECE inherits TACE and only overrides its magnetic architecture,
# dataset keys, loss, and validation metric.
defaults:
  - tace
  - _self_

dataset:
  train_file: ${oc.env:HOME}/dataset/LCAO/lcao_train.xyz
  valid_file: ${oc.env:HOME}/dataset/LCAO/lcao_val.xyz
  keys:
    energy_key: energy
    forces_key: forces
    stress_key: stress
    virials_key: virials
    initial_noncollinear_magmoms_key: initial_noncollinear_magmoms
    noncollinear_magnetic_forces_key: noncollinear_magnetic_forces

  train_dataloader:
    batch_size: 16

  valid_dataloader:
    batch_size: 8

  storage_mode: lmdb
  shard_dirs: 
    - ${oc.env:HOME}/dataset/LCAO/graphCache

loss:
  loss_property: [energy, forces, stress, noncollinear_magnetic_forces]
  loss_function_name:
    - mse_energy_per_atom
    - mse_forces
    - mse_stress
    - mse_noncollinear_magnetic_forces
  loss_property_weights: [1.0, 1.0, 1.0, 10.0]
  loss_function_kwargs:
    - {}
    - {}
    - {}
    - {}

synth_metric:
  val/noncollinear_magnetic_forces_mae: 5.0
  val/noncollinear_magnetic_forces_rmse: 1.0

model:
  config:
    parity: true

    atomic_basis:
      type: o2_mag
      use_radial_rotary_attention: true

    product_basis:
      nonlinear: null
      scalar_act: null
      agnostic: false
