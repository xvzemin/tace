[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "EquivariantX"
version = "0.1.0"
description = "Spherical and Cartesian O(3)/O(2) operators, frame conversions, and fused CUDA convolutions."
readme = "README.md"
authors = [{ name = "Zemin Xu", email = "xv_chana@163.com" }]
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.4",
    "e3nn>=0.4.4",
    "scipy>=1.15",
]

[project.optional-dependencies]
dev = ["pytest"]
cuda = ["ninja", "filelock"]
mace = ["mace-torch>=0.3.17"]
nequip = ["nequip>=0.19.1"]
sevennet = ["sevenn>=0.13.0"]

[project.urls]
Homepage = "https://github.com/xvzemin/tace"
Documentation = "https://tace.readthedocs.io/en/latest/equivariantx/api.html"

[tool.setuptools]
packages = [
    "eqx", "eqx.o2", "eqx.o3", "eqx.co2", "eqx.co3", "eqx.ace", "eqx.kernels", "eqx.nn",
    "eqx.utils",
    "eqx.conv", "eqx.conv.o2_o3", "eqx.conv.o3", "eqx.conv.co3",
    "eqx.conv.uu_o2", "eqx.conv.uv_o2", "eqx.models",
    "eqx.models.tace", "eqx.models.tace.tece_oam_rra",
    "eqx.models.mace", "eqx.models.nequip", "eqx.models.sevennet",
    "eqx.models.prophet", "eqx.models.equflash",
]
package-dir = { eqx = "." }

[tool.setuptools.package-data]
eqx = ["README.md", "kernels/csrc/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
