[build-system]
requires = ["setuptools>=74.1", "wheel"]
build-backend = "setuptools.build_meta"

[[tool.setuptools.ext-modules]]
name = "tace.dataset._connectivity"
sources = ["tace/dataset/connectivity.c"]
optional = true

[project]
name = "TACE"
version = "0.2.5"
description = "TACE - ST and ICT based equivariant atomistic model."
authors = [{ name = "Zemin Xu", email = "xv_chana@163.com" }]

requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torch_geometric>=2.4",
    "lightning",
    "hydra-core>=1.3",
    "omegaconf",
    "ase",
    "ase-db-backends",
    "matscipy",
    "numpy",
    "e3nn>=0.4.4",
    "scipy>=1.15",
    "configargparse",
    "pandas",
    "matplotlib",
    "lmdb",
    "huggingface_hub",
    "tqdm",
    "filelock",
    "ninja",
]

[project.optional-dependencies]

dev = [
    "pytest",
    "ruff>=0.16,<0.17",
]

oeq = [
    "openequivariance>=0.6.4",
]

luna = [
    "LunaEquivariance>=0.1.0",
]

torchsim = [
    "torch-sim-atomistic>=0.6.1",
]

nvalchemi = [
    "nvalchemi-toolkit>=0.1.0",
    "nvalchemi-toolkit-ops",
]

cueq12 = [
    "cuequivariance",
    "cuequivariance-torch",
    "cuequivariance-ops-torch-cu12",
]

cueq13 = [
    "cuequivariance",
    "cuequivariance-torch",
    "cuequivariance-ops-torch-cu13",
]


openmm = ["openmmml>=1.8"]

lammps12 = [
    "cython",
    "cupy-cuda12x",
]

lammps13 = [
    "cython",
    "cupy-cuda13x",
]

d3 = [
    "torch_dftd",
]

nl = [
    "ase",
    "matscipy",
    "vesin",
    "nvalchemi-toolkit>=0.1.0",
    "nvalchemi-toolkit-ops",
]

spb = ["physical-basis==1.0.0"]

[project.urls]
Homepage = "https://github.com/xvzemin/tace"

[project.scripts]
tace-train = "tace.scripts.train:main"
tace-fast-train = "tace.scripts.train_fast:main"
tace-eval = "tace.scripts.eval:main"
tace-clean = "tace.scripts.clean:main"
tace-split = "tace.scripts.split:main"
tace-export-train = "tace.scripts.export_train:main"
tace-export-eval = "tace.scripts.export_eval:main"
tace-export-elements = "tace.scripts.export_elements:main"
tace-export-lammps = "tace.scripts.export_lammps:main"
tace-compile = "tace.scripts.export_eval:main"
tace-update = "tace.scripts.update:main"
tace-finetune = "tace.scripts.finetune:main"
tace-convert-lora = "tace.scripts.convert_lora:main"
tace-convert-cgtp = "tace.scripts.convert_cgtp:main"
tace-average = "tace.scripts.average:main"
tace-plot-diatom = "tace.scripts.plot_diatom:main"

[tool.setuptools.packages.find]
include = ["tace", "tace.*", "equivariantx", "equivariantx.*", "equivariantx_foundation", "equivariantx_foundation.*"]
namespaces = false
exclude = ["equivariantx.tests", "equivariantx.tests.*", "equivariantx_foundation.tests", "equivariantx_foundation.tests.*"]

[tool.setuptools.package-data]
"tace.dataset" = ["stats_yaml/*.yaml"]
equivariantx = ["LICENSE.md", "ops/common/cuda/csrc/*.cpp", "ops/cuda/co2/*.cu"]
equivariantx_foundation = ["LICENSE.md", "models/tace/tace_oam_xl_v2/README.rst"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E402",  # Intentional optional and delayed imports.
    "E711",  # Preserve existing equality semantics.
    "E712",  # Preserve existing equality semantics.
    "E741",  # Mathematical code conventionally uses l, I, and O.
    "F401",  # Public APIs currently rely on import-based re-exports.
    "F811",  # Keep compatibility fallbacks and optional definitions unchanged.
    "F841",  # Do not remove potentially intentional intermediate values.
]

[tool.ruff.lint.isort]
known-first-party = ["equivariantx", "equivariantx_foundation", "tace"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
