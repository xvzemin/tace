[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TACE"
version = "0.2.2"
description = "TACE - ST and ICT based equivariant atomistic model."
authors = [{ name = "Zemin Xu", email = "xv_chana@163.com" }]

requires-python = ">=3.9"
dependencies = [
    "torch>=2.4",
    "torch_geometric>=2.4",
    "lightning",
    "omegaconf",
    "hydra-core>=1.3",
    "matscipy",
    "ase",
    "numpy",
    "e3nn",
    "scipy",
    "configargparse",
    "pandas",
    "lmdb",
    "huggingface_hub",
    #  "wandb",
]

[project.optional-dependencies]

dev = [
    "pytest",
    "ruff>=0.16,<0.17",
]

oeq = [
    "openequivariance>=0.5.4",
]

torchsim = [
    "torch-sim-atomistic>=0.6.1",
]

nvalchemi = [
    "nvalchemi-toolkit>=0.1.0",
    "nvalchemi-toolkit-ops",
]

scf = []
 
cueq12 = [
    "cuequivariance",
    "cuequivariance-torch",
    "cuequivariance-ops-torch-cu12",
]

cueq13 = [
    "cuequivariance",
    "cuequivariance-torch",
    "cuequivariance-ops-torch-cu13",
]

openmm = [
    "openmm",
    "openmm-ml",
    "openmmtorch",
    # conda install -c conda-forge nnpops
]

lammps12 = [
    "cython",
    "cupy-cuda12x",
]

lammps13 = [
    "cython",
    "cupy-cuda13x",
]

d3 = [
    "torch_dftd",
]

nl = [
    "ase",
    "matscipy",
    "vesin",
]

[project.urls]
Homepage = "https://github.com/xvzemin/tace"

[project.scripts]
tace-train = "tace.scripts.train:main"
tace-eval = "tace.scripts.eval:main"
tace-clean = "tace.scripts.clean:main"
tace-split = "tace.scripts.split:main"
tace-export-train = "tace.scripts.export_train:main"
tace-export-eval = "tace.scripts.export_eval:main"
tace-export-lammps = "tace.scripts.export_lammps:main"
tace-compile = "tace.scripts.export_eval:main"
tace-update = "tace.scripts.update:main"
tace-finetune = "tace.scripts.finetune:main"
tace-convert = "tace.scripts.convert:main"
tace-average = "tace.scripts.average:main"
tace-uspex-relax = "tace.interface.uspex.relax:main"

[tool.setuptools.packages.find]
include = [
    "tace",
    "tace.*",
    "eqx",
    "eqx.*",
]

[tool.setuptools.package-data]
"tace.utils" = ["*.yaml"]
"tace.models.scf" = ["*.md", "longrange/*.md"]
"eqx" = ["README.md"]

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = [
    "tace/models/eqt/equitorch",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E402",  # Intentional optional and delayed imports.
    "E711",  # Preserve existing equality semantics.
    "E712",  # Preserve existing equality semantics.
    "E741",  # Mathematical code conventionally uses l, I, and O.
    "F401",  # Public APIs currently rely on import-based re-exports.
    "F811",  # Keep compatibility fallbacks and optional definitions unchanged.
    "F841",  # Do not remove potentially intentional intermediate values.
]

[tool.ruff.lint.isort]
known-first-party = ["eqx", "tace"]

[tool.ruff.format]
line-ending = "lf"
